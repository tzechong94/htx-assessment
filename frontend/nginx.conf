server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Same-origin API: the browser never talks to the backend directly, so no CORS is needed.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # LLM skill identification can take a few seconds.
    proxy_read_timeout 30s;
  }

  # Vite emits content-hashed filenames, so these can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback: client-side routes such as /tasks/new resolve to index.html.
  location / {
    try_files $uri /index.html;
  }
}
